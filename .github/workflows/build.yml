name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: build release apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.0.0'
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/zcode-release.jks
            {
              echo "storeFile=zcode-release.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "signed with the project release key"
          else
            echo "::warning::no signing secrets found, falling back to debug signature"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Rename artifact
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/zcode-mobile.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: zcode-mobile-apk
          path: out/zcode-mobile.apk
          retention-days: 90

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/zcode-mobile.apk
          generate_release_notes: true
          body: |
            ZCode Mobile — a phone-first client for GLM Coding Plan.

            Install: download `zcode-mobile.apk` below, allow installation from
            unknown sources, then paste your Coding Plan API key on first launch.
