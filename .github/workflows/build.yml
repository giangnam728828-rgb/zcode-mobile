name: android

# Push code without burning Actions minutes: builds only run for a tag or a
# manual dispatch from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: build release apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Hard stop: a debug/temporary signature would break in-place updates.
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::release signing secrets are missing — refusing to build a temporarily signed APK"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/zcode-release.jks
          {
            echo "storeFile=zcode-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          keytool -list -keystore android/app/zcode-release.jks \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | tail -3
          echo "signed with the fixed project release key"

      - name: Build APK
        run: flutter build apk --release

      - name: Rename artifact
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/zcode-mobile.apk
          ls -lh out

      - name: Verify the APK carries the fixed key
        env:
          EXPECTED_SHA256: '32:0B:A9:4F:FD:6A:CB:DD:2B:C2:1A:85:2C:4B:69:C0:F3:67:1B:8C:35:BE:27:E2:B9:A8:0C:71:53:C4:9F:4A'
        run: |
          # AGP 9 signs with v2/v3 only, so there is no META-INF/*.RSA to read.
          # apksigner reports the certificate actually embedded in the APK.
          APKSIGNER="$(ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          echo "apksigner: ${APKSIGNER:-<none>}"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found; cannot verify the signature"
            exit 1
          fi
          ACTUAL="$("$APKSIGNER" verify --print-certs out/zcode-mobile.apk | grep -m1 'SHA-256 digest' | sed 's/^.*digest: //')"
          # apksigner prints lowercase without separators; the stored fingerprint
          # is uppercase with colons. Normalise before comparing.
          norm() { echo "$1" | tr -d ':' | tr '[:upper:]' '[:lower:]'; }
          echo "expected: $EXPECTED_SHA256"
          echo "actual  : $ACTUAL"
          if [ "$(norm "$ACTUAL")" != "$(norm "$EXPECTED_SHA256")" ]; then
            echo "::error::APK is not signed with the fixed project key — updates would be rejected by Android"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: zcode-mobile-apk
          path: out/zcode-mobile.apk
          retention-days: 90

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/zcode-mobile.apk
          generate_release_notes: true
          body: |
            ZCode Mobile — a phone-first client for GLM Coding Plan.

            Install: download `zcode-mobile.apk` below, allow installation from
            unknown sources, then paste your Coding Plan API key on first launch.
