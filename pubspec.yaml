name: zcode_mobile
description: ZCode Mobile - a phone-first coding agent client for GLM / ZCode.
publish_to: 'none'
version: 3.11.2+19

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.1
  provider: ^6.1.5
  liquid_glass_widgets: ^1.19.0
  # Desktop remote control (总方案 阶段B): the official remote page runs in an
  # embedded webview; QR pairing uses the camera scanner.
  webview_flutter: ^4.10.0
  mobile_scanner: ">=5.2.3 <8.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/app_icon.png
    - assets/brand/cover_banner.png
