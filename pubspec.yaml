name: zcode_mobile
description: ZCode Mobile - a phone-first coding agent client for GLM / ZCode.
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^0.13.5
  url_launcher: ^6.1.0
  path_provider: ^2.0.11
  flutter_secure_storage: ^5.0.2
  shared_preferences: ^2.0.15
  flutter_markdown: ^0.6.12
  markdown: ^6.0.0
  provider: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
