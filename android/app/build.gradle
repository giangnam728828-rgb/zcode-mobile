plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Optional release signing. CI writes android/key.properties from secrets so
// every build shares one signature and updates install over the previous app.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace 'ai.zcode.zcode_mobile'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "ai.zcode.zcode_mobile"
        // 23 (Android 6) is the floor for Shizuku's provider and for the
        // settings/DND APIs the automation uses; 5.x is not a target device.
        minSdk 23
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            shrinkResources false
            minifyEnabled false
        }
    }

    // The device channel talks to API 30+ storage APIs behind runtime guards;
    // lint's NewApi check cannot see those guards and would fail the release.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// A release build must carry the project's fixed key: debug signatures change
// on every machine and would block updates over an installed copy.
gradle.taskGraph.whenReady { graph ->
    boolean wantsRelease = graph.allTasks.any {
        it.name.toLowerCase().contains('release')
    }
    if (wantsRelease && !keystorePropertiesFile.exists()) {
        throw new GradleException(
                "Release signing key not configured.\n" +
                "Create android/key.properties with storeFile / storePassword / " +
                "keyAlias / keyPassword, or copy the project keystore next to " +
                "android/app and point storeFile at it.\n" +
                "Debug builds are unaffected: flutter build apk --debug")
    }
}

flutter {
    source '../..'
}

dependencies {
    // The Kotlin Gradle plugin adds kotlin-stdlib itself; listing it here
    // would pin a version that no longer matches the compiler.
    // FileProvider for handing a real file to another app.
    implementation 'androidx.core:core:1.13.1'
    // Shizuku: run privileged shell commands through the shell uid without
    // root.
    implementation 'dev.rikka.shizuku:api:12.1.0'
    implementation 'dev.rikka.shizuku:provider:12.1.0'
}
